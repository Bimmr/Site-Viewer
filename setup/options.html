<!DOCTYPE html>
<html>

<head>
    <title>SiteViewer Options</title>
    <link rel="stylesheet" href="/css/viewer.css">
</head>

<body>
    <div class="form-item border">
        <input type="checkbox" id="options-manageDownloads" checked>
        <label for="options-manageDownloads">Name Downloads</label>
        <p>Name downloaded files after their URL and save them in the download directory set in Site Viewer.<br><small>Turn this off to let the browser name downloads. Combined pages are always named.</small></p>
    </div>
</body>
<style>
    body{
        padding: 1em;
    }
    .form-item p{
        padding: 0.5em;
    }
</style>

<script src="options.js" type="module"></script>
</html>
